<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Detalhes da Categoria</title>
    
    <!-- Link para o CDN do CSS do Bootstrap 5.3 (necessário) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- CSS Customizado Opcional para réplica visual exata -->
    <style>
        /* Cor de fundo do contêiner para imitar a imagem */
        .replica-container {
            background-color: #f1f1f1;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
            border-radius: 4px;
        }

        /* Estilo para as labels de texto fixo (IdCategoria) */
        .form-label-fixed {
            display: inline-block;
            width: 130px; /* Alinhamento consistente */
            color: #333;
            margin-bottom: 0.5rem;
        }

        /* Estilo para o valor fixo (IdCategoria) */
        .form-value-fixed {
            display: inline-block;
            color: #111;
            padding-left: 0.5rem;
        }

        /* Estilos adicionais para os inputs Bootstrap (Opcional, o Bootstrap já cuida da maior parte) */
        .form-control, .form-control:focus {
            background-color: transparent;
            border: 1px solid #ced4da;
            color: #111;
        }
    </style>
</head>
<body>

    <!-- Uso de <main> e <article> para demarcar conteúdo principal/específico -->
    <main class="container">
        <article class="replica-container">
            
            <!-- Usamos <form> pois este conteúdo representa campos de entrada de dados -->
            <form>
                
                <!-- ID DA CATEGORIA (Layout Flexbox do Bootstrap para alinhar label e valor) -->
                <div class="row mb-3 align-items-center">
                    <div class="col-sm-4">
                        <span class="form-label-fixed">IdCategoria</span>
                    </div>
                    <div class="col-sm-8">
                        <span class="form-value-fixed">1</span>
                    </div>
                </div>

                <!-- NOME DA CATEGORIA (Layout de Form do Bootstrap) -->
                <div class="row mb-3 align-items-center">
                    <!-- <label> semântico vinculado ao input -->
                    <label for="inputNome" class="col-sm-4 col-form-label">Nome:</label>
                    <div class="col-sm-8">
                        <!-- Input Bootstrap v5 com classe form-control -->
                        <input type="text" class="form-control" id="inputNome" aria-label="Nome da Categoria">
                    </div>
                </div>

                <!-- DESCRIÇÃO DA CATEGORIA (Layout de Form do Bootstrap) -->
                <div class="mb-3">
                    <!-- <label> acima do campo, como na imagem -->
                    <label for="textareaDescricao" class="form-label d-block text-start mb-2">Descrição:</label>
                    
                    <!-- <textarea> Bootstrap v5 -->
                    <textarea class="form-control" id="textareaDescricao" rows="6" aria-label="Descrição da Categoria"></textarea>
                </div>

                <!-- (Opcional) Adicione um botão de ação para completar o formulário -->
                <!-- <div class="text-end">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div> -->
                
                <section class="d-flex justify-content-evenly">
                    <button type="button" class="btn btn-primary">Salvar</button>
                    <button type="button" class="btn btn-danger">Cancelar</button>
                </section>



            </form>

        </article>
    </main>

    <!-- (Opcional) Link para o JS do Bootstrap, se houver interatividade -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> -->

</body>
</html>
