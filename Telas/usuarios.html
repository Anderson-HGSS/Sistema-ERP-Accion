<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Usuários</h1>
    <form class="container" style="padding: 20px; background-color: rgb(221, 221, 221);">

        <div>
            <label for="nome">Código do usuário:</label>
            <input type="text" disabled name="codigo" id="codigo">
        </div>

        <div style="margin-top: 10px;">
            <label for="nome" class="form-label">Insira o nome:</label>
            <input type="text" name="nome" id="nome" class="form-control">
        </div>
       
        <div>
            <label for="nome" class="form-label">Insira o nome completo:</label>
            <input type="text" name="nome" id="nome" class="form-control">
        </div>
        
        <div>
            <label for="nome" class="form-label">Insira o login do usuário:</label>
            <input type="text" name="nome" id="nome" class="form-control">
        </div>
        
        <div>
            <label for="nome" class="form-label">Insira o e-mail:</label>
            <input type="email" name="nome" id="nome" class="form-control">
        </div>

        <div>
            <label for="nome" class="form-label">Insira a senha:</label>
            <input type="password" name="nome" id="nome" class="form-control">
        </div>

        <div style="margin-top: 15px;">
            <a href="menu.html"><button type="button" class="btn btn-primary">Cadastrar</button></a>
            <a href="menu.html"><button type="button" class="btn btn-danger">Cancelar</button></a>
        </div>
    </form>
</body>
</html>
