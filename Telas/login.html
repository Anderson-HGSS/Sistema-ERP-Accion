<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style=" width: 400px; padding: 20px; font-family: Arial, Helvetica, sans-serif;" class="container">
    
    <h1 style="text-align: center;">Login</h1>

    <form style="border: 1px solid rgb(172, 172, 172); background-color: rgb(221, 221, 221); padding: 20px;"  class="">
        <div>
            <label for="email">Insira seu e-mail:</label>
            <input class="form-control" type="email" name="email" id="emailLogin">
        </div>

        <div>
            <label for="senha">Insira sua senha: </label>
            <input class="form-control" type="password" name="senha" id="senhaLogin">
        </div>

        <div style="margin: 15px;" class="d-flex justify-content-evenly">
            <a href="menu.html"><button class="btn btn-primary" type="button">Entrar</button></a>
            <a href=""><button class="btn btn-danger" type="button">Cancelar</button></a>
        </div>

        <a href="esqueciSenha.html">Esqueci minha senha</a>
    </form>

</body>

</html>
